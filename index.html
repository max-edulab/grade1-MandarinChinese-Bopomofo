<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ㄅㄆㄇ心愛小鎮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one centered arcade cabinet — title bar, inventory HUD, 4:3 pixel stage (tap to walk). Single sky-blue look on purpose. */
  --sky:#5c94fc;
  --ink:#1b1b2f;
  --paper:#fffbe8;
  --brick:#c84c0c;
  --gold:#fcbc3c;
  --leaf:#3c9c28;
  --night:#23244a;
  --muted:#6a6a80;
  --hz:#4a4b5c;
  --f-zy:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --f-px:"Press Start 2P",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-zy);
  background-image:
    linear-gradient(var(--sky),var(--sky));
}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:12px 14px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{margin:0;font-weight:900;font-size:clamp(22px,4.4vw,34px);color:#fff;letter-spacing:.02em;
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),6px 6px 0 rgba(0,0,0,.25)}
.logo .b{color:var(--gold)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--f-zy);font-weight:700;font-size:15px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:5px 10px;cursor:pointer;line-height:1.3}
.chip:active{transform:translateY(3px);box-shadow:none}
.chip[aria-pressed="true"]{background:var(--gold)}
.chip:focus-visible,.btn:focus-visible,.lvcard:focus-visible,.spk:focus-visible,.x:focus-visible{outline:4px solid var(--gold);outline-offset:2px}

.hud{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--night);color:#fff;border:4px solid var(--ink);padding:8px 12px;min-height:56px}
.lvname{font-family:var(--f-zy);font-weight:900;font-size:18px;display:flex;align-items:center;gap:8px;color:#fff;background:none;border:2px dashed transparent;padding:2px 6px;cursor:pointer}
.lvname:hover,.lvname:focus-visible{border-color:var(--gold);outline:none}
.lvname .info{font-family:var(--f-px);font-size:10px;color:var(--ink);background:var(--gold);border:2px solid #fff;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
/* 遊戲說明視窗 */
.modal{position:fixed;inset:0;z-index:60;background:rgba(18,20,60,.6);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.help-panel{max-width:640px;display:flex;flex-direction:column;gap:14px}
.help-title{font-size:clamp(20px,3vw,26px);font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.help-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.help-list li{display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(18px,2.6vw,22px)}
.help-list .ico{flex:none;min-width:56px;text-align:center;font-size:26px}
.parent{border-top:3px dashed var(--ink);padding-top:10px;color:var(--muted);font-size:14px;line-height:1.7}
.parent h3{margin:0 0 4px;font-size:15px;color:var(--ink)}
.parent p{margin:0 0 6px}
.help-panel .row{justify-content:flex-end}
.lvname .tag{font-family:var(--f-px);font-size:10px;background:var(--brick);padding:5px 6px;border:2px solid #fff}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.slot{display:flex;align-items:center;gap:6px;background:#34365e;border:2px solid #6a6ea8;padding:3px 8px;font-size:14px;font-weight:700}
.slot .ic{font-size:22px;filter:grayscale(1) opacity(.35)}
.slot .nm{opacity:.55}
.slot.got{background:#2f7a1e;border-color:var(--gold)}
.slot.got .ic{filter:none}
.slot.got .nm{opacity:1}
.slot.pop{animation:pop .5s steps(4)}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}

.stage{position:relative;width:100%;margin-inline:auto;aspect-ratio:4/3;max-width:100%;border:4px solid var(--ink);background:#000;box-shadow:8px 8px 0 rgba(0,0,0,.25)}
#game{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
/* 電腦版寬畫面：地圖置中，兩側深色邊，對話框可以更寬 */
.stage.wide{aspect-ratio:auto;background:repeating-linear-gradient(45deg,#23244a 0 12px,#1e1f40 12px 24px)}
.stage.wide #game{position:absolute;top:0;left:50%;height:100%;transform:translateX(-50%)}
.stage.wide .town{inset:0 auto 0 50%;transform:translateX(-50%)}
.stage.wide .panel{max-width:min(1000px,100%)}
.stage.wide .center-panel{max-width:min(900px,100%)}

.ov{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:10px;overflow:auto}
/* 關卡開頭牌、答對、過關：懸浮在整個畫面上，不受遊戲區高度限制 */
.ov.center{position:fixed;inset:0;z-index:40;align-items:center;padding:16px;background:rgba(18,20,60,.55)}
.ov.center .panel{max-height:calc(100% - 8px)}
.panel{position:relative;width:100%;max-width:720px;max-height:100%;overflow:auto;background:var(--paper);border:4px solid var(--ink);
  box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 6px var(--gold),6px 6px 0 rgba(0,0,0,.35);padding:16px 18px}
[hidden]{display:none!important}
/* 直式注音 */
.sy{display:inline-flex;align-items:flex-end;vertical-align:middle;margin:.1em .1em;padding-right:.36em;line-height:1}
.sy .col{display:inline-flex;flex-direction:column;align-items:center}
.sy b{position:relative;display:block;font-weight:inherit;font-size:.62em;line-height:1.04}
.sy .dot{display:block;font-style:normal;font-size:.55em;line-height:.55}
.ru .sy .dot{font-size:.7em}
/* 聲調：放在最後一個注音符號的右上方 */
.sy .tn{position:absolute;left:100%;top:-.12em;margin-left:.02em;font-style:normal;font-size:.8em;line-height:1}
.sy.m .tn{top:-.5em} /* 兩個以上符號：聲調在最後兩個符號之間的右邊 */
.pu{display:inline-block;vertical-align:middle;margin-inline:.05em}
.shopbar{display:flex;align-items:center;gap:12px;background:var(--paper);border:4px solid var(--ink);padding:8px 12px;min-height:96px}
.shopbar .main{gap:2px}
.shopbar .fb{font-size:17px}
.pips{display:flex;gap:3px;flex-wrap:wrap}
.pips i{width:12px;height:12px;background:#34365e;border:2px solid #6a6ea8}
.pips i.on{background:var(--gold);border-color:#fff}
.han{display:none}
/* 國字＋注音 */
.ru{display:inline-flex;align-items:center;vertical-align:middle;margin:.06em .04em}
.ru .hz{display:block;font-size:1.7em;line-height:1.1;color:var(--hz)}
.ru .sy{font-size:.44em;margin:0 0 0 .14em}
.ru .sy b{font-size:1em;line-height:1.08}
/* 有底色或特別顏色的地方，國字跟著原本的文字顏色 */
.btn:not(.alt) .hz,.hud .hz,.q .hz,.headline .hz,.fb .hz,.title-logo .hz,b .hz,[style] .hz{color:inherit}
body.no-hz .ru .hz{display:none}
body.no-hz .ru .sy{font-size:1em}
body.no-hz .ru .sy b{font-size:.8em}

.talk{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px 16px}
.who{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.portrait{width:72px;height:72px;image-rendering:pixelated;background:#cfe6ff;border:3px solid var(--ink)}
.who .nm{font-weight:900;font-size:15px;line-height:1.3}
.main{min-width:0;display:flex;flex-direction:column;gap:10px}
.say{font-size:clamp(22px,3.2vw,30px);font-weight:700;line-height:1.55}
.ask{display:flex;align-items:center;gap:12px;background:#fff;border:3px dashed var(--ink);padding:8px 12px}
.ask .qwrap{min-width:0;flex:1}
.pic{font-size:52px;line-height:1}
.q{font-size:clamp(22px,3.2vw,30px);font-weight:900;color:var(--brick);line-height:1.5}
.spk{flex:none;font-family:var(--f-zy);font-weight:700;font-size:15px;background:var(--gold);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:6px 9px;cursor:pointer}
/* 「聽」預設關閉，上方開啟後才顯示朗讀按鈕 */
body:not(.tts-on) .spk{display:none!important}
.spk:active{transform:translateY(3px);box-shadow:none}
.fb{min-height:1.5em;font-weight:900;font-size:18px;color:var(--brick)}
.fb:empty{display:none}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;font-family:var(--f-zy);font-size:clamp(20px,2.8vw,26px);font-weight:700;color:var(--ink);
  background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:8px 12px;cursor:pointer;min-height:56px;min-width:0}
.opt .n{flex:none;font-family:var(--f-px);font-size:10px;background:var(--ink);color:#fff;padding:5px 6px}
.opt .e{flex:none;font-size:1.35em;line-height:1}
.opt .zy{min-width:0}
.opt:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.opt:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.opt.ok{background:#8ae864}
.opt.no{background:#dcdce4;color:#9a9aa8;box-shadow:none;transform:translateY(4px);animation:shake .3s steps(3)}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{translate:0}33%{translate:-5px}66%{translate:5px}}
.x{position:absolute;top:8px;right:8px;font-family:var(--f-zy);font-weight:700;font-size:14px;background:#fff;border:3px solid var(--ink);padding:2px 8px;cursor:pointer}

.btn{font-family:var(--f-zy);font-weight:900;font-size:22px;color:#fff;background:var(--brick);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:8px 22px;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);font-size:18px}
.btn:active{transform:translateY(5px);box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}

.center-panel{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:600px}
.big{font-size:72px;line-height:1;animation:bounce 1s steps(4) infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.headline{font-size:clamp(26px,4.4vw,40px);font-weight:900;color:var(--brick);line-height:1.3}
.stars{font-size:40px;letter-spacing:6px;color:var(--gold);-webkit-text-stroke:2px var(--ink)}
.stars .off{color:#d8d4c0}
.items{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.items .it{background:#fff;border:3px solid var(--ink);padding:4px 12px;font-weight:700;font-size:21px}
.items .it > span:first-child{font-size:22px;margin-right:4px}
.intro-head{display:flex;align-items:center;gap:12px;text-align:left}
.intro-lines{font-size:clamp(19px,2.8vw,25px);font-weight:700;line-height:1.6;text-align:left}
.eyebrow{font-weight:900;font-size:15px;color:var(--muted)}

.title-logo{font-size:clamp(22px,3.6vw,32px);font-weight:900;color:#fff;line-height:1.2;
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),6px 6px 0 rgba(0,0,0,.3)}
.title-logo .b{color:var(--gold);font-size:1.5em}
.title-logo .sy{text-shadow:none;color:var(--ink)}
.lvs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.lvcard{display:flex;flex-direction:row;align-items:center;gap:12px;text-align:left;font-family:var(--f-zy);color:var(--ink);background:#fff;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:10px 6px;cursor:pointer}
.lvcard:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.lvcard .em{font-size:40px;line-height:1.1}
.lvcard .no{font-weight:700;font-size:14px;color:var(--muted)}
.lvcard .nm{font-weight:900;font-size:18px}
.lvcard .st{margin-left:auto;color:var(--gold);font-size:18px;-webkit-text-stroke:1px var(--ink);letter-spacing:2px}
.lvcard .st .off{color:#e2dfcf}
.press{font-family:var(--f-px);font-size:10px;color:var(--muted);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* 小鎮地圖：四角招牌＋中間的區域介紹 */
.town{position:absolute;inset:0;pointer-events:none}
.sign{position:absolute;pointer-events:auto;display:flex;align-items:center;gap:8px;font-family:var(--f-zy);font-weight:900;font-size:17px;color:#fff;background:#a0643c;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 0 0 2px #c88a52;padding:4px 10px;cursor:pointer}
.sign .hz{color:inherit}
.sign .em{font-size:22px}
.sign .st{color:var(--gold);font-size:13px;-webkit-text-stroke:1px var(--ink)}
.sign .st .off{color:#e2c8a8}
.sign:hover,.sign:focus-visible{background:#c87c3c;transform:translateY(-2px);outline:3px solid var(--gold)}
.sign.tl{left:2%;top:3%}.sign.tr{right:2%;top:3%}.sign.bl{left:2%;bottom:3%}.sign.br{right:2%;bottom:3%}
.tip{position:absolute;width:min(46%,340px);background:var(--paper);border:4px solid var(--ink);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 6px var(--gold),6px 6px 0 rgba(0,0,0,.35);padding:10px 12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;font-size:16px}
.tip.tl{left:2%;top:calc(3% + 54px)}.tip.tr{right:2%;top:calc(3% + 54px)}.tip.bl{left:2%;bottom:calc(3% + 54px)}.tip.br{right:2%;bottom:calc(3% + 54px)}
.sign.tc{left:50%;top:3%;translate:-50% 0}
.tip.tc{left:50%;top:calc(3% + 54px);translate:-50% 0}
.prog{display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:20px}
.sw{display:inline-block;width:14px;height:14px;border:2px solid var(--ink)}
.tip-head{display:flex;align-items:center;gap:8px}
.tip-head .st{margin-left:auto;color:var(--gold);font-size:16px;-webkit-text-stroke:1px var(--ink)}
.tip-head .st .off{color:#e2dfcf}
.tip-big{font-size:34px;line-height:1}
.tip-name{font-weight:900;font-size:20px}
.tip-blurb{font-weight:700;font-size:17px;line-height:1.5}
.tip-goal{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:24px}
.tip-goal .it{font-size:16px;font-weight:700;background:#fff;border:2px solid var(--ink);padding:2px 8px}
.tip-go{font-weight:900;color:var(--brick);font-size:15px}
.tip-go .hz{color:inherit}
.hud-hint{font-weight:900;font-size:16px}
@media (max-width:640px){.sign{font-size:12px;padding:2px 6px;gap:4px}.sign .em{font-size:16px}.sign .st{display:none}.tip{display:none!important}}

.help{display:flex;flex-direction:column;gap:6px;background:var(--paper);border:3px solid var(--ink);padding:10px 14px;font-size:15px}
.help .zy{font-weight:700;font-size:17px}
.help p{margin:0;color:var(--muted)}
kbd{font-family:var(--f-px);font-size:9px;background:#fff;border:2px solid var(--ink);padding:2px 4px}

@media (max-width:640px){
  .ov{position:fixed;inset:0;z-index:30;align-items:center;background:rgba(18,20,60,.6);padding:12px}
  .talk{grid-template-columns:1fr}
  .who{flex-direction:row;justify-content:flex-start;text-align:left}
  .portrait{width:56px;height:56px}
  .lvs{grid-template-columns:1fr}
  .lvcard{flex-direction:row;justify-content:flex-start;gap:12px;padding:8px 12px}
  .lvcard .st{margin-left:auto}
}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1 class="logo"><span class="b">ㄅㄆㄇ</span>心愛小鎮</h1>
    <div class="tools">
      <button class="chip" id="btnHan" aria-pressed="true" title="國字開關：關掉就只看注音">國字</button>
      <button class="chip" id="btnTts" aria-pressed="false" title="開啟後，題目旁會出現「🔊聽」按鈕，可以朗讀">👂 聽</button>
      <button class="chip" id="btnSnd" aria-pressed="true" title="音效開關">🔊 音效</button>
      <button class="chip" id="btnMenu" title="回到小鎮地圖（主畫面）">🏠 選關</button>
    </div>
  </header>

  <div class="hud" id="hud">
    <button class="lvname" id="lvname" title="點一下看遊戲說明"><span class="tag">LV 1</span><span></span></button>
    <div class="slots" id="slots"></div>
  </div>

  <div class="shopbar" id="shopbar" hidden aria-live="polite">
    <canvas class="portrait" id="custPortrait" width="18" height="18"></canvas>
    <div class="main"><div class="say" id="sbSay"></div><div class="han" id="sbHan"></div><div class="fb" id="sbFb"></div></div>
    <button class="spk" id="sbSpk">🔊 <span data-zy="ㄊㄧㄥ"></span></button>
  </div>

  <div class="stage" id="stage">
    <canvas id="game" width="256" height="192" aria-label="遊戲地圖"></canvas>
    <div class="town" id="town" hidden></div>
    <div class="ov" id="ov" hidden></div>
  </div>


  <div class="modal" id="helpModal" hidden role="dialog" aria-modal="true" aria-label="遊戲說明">
    <div class="panel help-panel" id="helpBody"></div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================= 資料：三個關卡 ================= */
// 每題：say 角色說的話（可省略）、q 問題、pic 題目圖、opts 選項 [注音, 圖]；第一個選項是正確答案，出題時會打亂。
const LEVELS = [
{
  name:'ㄋㄨㄥˊ ㄔㄤˇ', han:'農場', emoji:'🐔', theme:'farm',
  map:[
    '################',
    '#..H....*....*.#',
    '#.P=.......a...#',
    '#..=====......*#',
    '#*....=..FFFFF.#',
    '#..b..=..F...F.#',
    '#.....=..F.c.F.#',
    '#~~...=..FF.FF.#',
    '#~~~..======...#',
    '#~~..*....d..*.#',
    '#..*........R..#',
    '################'],
  giver:{name:'ㄇㄚ ˙ㄇㄚ', han:'媽媽', sprite:'mom'},
  intro:[
    ['ㄐㄧㄣ ㄊㄧㄢ ㄕˋ ㄇㄟˋ ˙ㄇㄟ ˙ㄉㄜ ㄕㄥ ㄖˋ。','今天是妹妹的生日。'],
    ['ㄑㄧㄥˇ ㄅㄤ ㄇㄚ ˙ㄇㄚ ㄓㄠˇ ㄉㄢˋ ㄍㄠ ㄘㄞˊ ㄌㄧㄠˋ！','請幫媽媽找蛋糕材料！']],
  win:['ㄉㄢˋ ㄍㄠ ㄗㄨㄛˋ ㄏㄠˇ ˙ㄌㄜ！','蛋糕做好了！','🎂'],
  npcs:[
    {key:'a', name:'ㄇㄨˇ ㄐㄧ', han:'母雞', sprite:'hen',
     item:{e:'🥚', z:'ㄐㄧ ㄉㄢˋ', h:'雞蛋'},
     hi:['ㄋㄧˇ ㄏㄠˇ！ㄨㄛˇ ㄕˋ ㄇㄨˇ ㄐㄧ。','你好！我是母雞。'],
     qs:[

function buildSprite(rows, pal){
  const c = document.createElement('canvas'); c.width = c.height = 18;
  const g = c.getContext('2d');
  rows.forEach((row, y) => {
    const s = rle(row);
    for (let x = 0; x < 16; x++){
      const ch = s[x]; if (ch === '.') continue;
      let col = pal[ch]; if (col === undefined && ch === 'x') col = pal.f;
      if (!col) continue;
      g.fillStyle = col; g.fillRect(x + 1, y + 1, 1, 1);
    }
  });
  // 自動描黑邊，做出紅白機的感覺
  const id = g.getImageData(0, 0, 18, 18), d = id.data, op = i => d[i * 4 + 3] > 0, edge = [];
  for (let y = 0; y < 18; y++) for (let x = 0; x < 18; x++){
    const i = y * 18 + x; if (op(i)) continue;
    if ((x > 0 && op(i - 1)) || (x < 17 && op(i + 1)) || (y > 0 && op(i - 18)) || (y < 17 && op(i + 18))) edge.push(i);
  }
  g.fillStyle = INK; edge.forEach(i => g.fillRect(i % 18, Math.floor(i / 18), 1, 1));
  return c;
}

const SOLID = new Set(['#','T','~','H','F','R']);

function hash(x, y, k){
  let h = Math.imul(x + 7, 374761393) + Math.imul(y + 13, 668265263) + Math.imul(k + 1, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const P = (g, x, y, c, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
const ri = (x, y, k, n) => Math.floor(hash(x, y, k) * n);

function ground(g, ox, oy, x, y, th){
  P(g, ox, oy, th.g, 16, 16);
  for (let i = 0; i < 6; i++) P(g, ox + ri(x,y,i,16), oy + ri(x,y,i+50,16), th.gd);
  for (let i = 0; i < 3; i++) P(g, ox + ri(x,y,i+20,16), oy + ri(x,y,i+30,16), th.gl);
  if (th.tuft && hash(x,y,99) < .45){
    const tx = ox + 2 + ri(x,y,98,10), ty = oy + 3 + ri(x,y,97,10);
    P(g, tx, ty, th.gd); P(g, tx + 2, ty, th.gd); P(g, tx + 1, ty + 1, th.gd);
  }
}
function path(g, ox, oy, x, y, th){
  if (th.boardwalk){
    P(g, ox, oy, th.p, 16, 16);
    for (let i = 0; i < 4; i++) P(g, ox, oy + i * 4 + 3, th.pd, 16, 1);
    P(g, ox + (x % 2 ? 5 : 11), oy, th.pd, 1, 16);
    return;
  }
  P(g, ox, oy, th.p, 16, 16);
  for (let i = 0; i < 7; i++) P(g, ox + ri(x,y,i+60,15), oy + ri(x,y,i+70,15), th.pd, i % 3 ? 1 : 2, 1);
}
function flower(g, ox, oy, x, y, th){
  ground(g, ox, oy, x, y, th);
  const cols = ['#ffffff', '#ff6ea8', '#fce040', '#ff8c3c'];
  for (let k = 0; k < 2; k++){
    const fx = ox + 3 + ri(x,y,k+80,9), fy = oy + 3 + ri(x,y,k+85,9), c = cols[ri(x,y,k+90,4)];
    P(g, fx, fy - 1, c); P(g, fx - 1, fy, c); P(g, fx + 1, fy, c); P(g, fx, fy + 1, c); P(g, fx, fy, '#fcd000');
    P(g, fx, fy + 2, th.gd, 1, 2);
  }
}
function roundTree(g, ox, oy, x, y, th){
  ground(g, ox, oy, x, y, th);
  P(g, ox + 6, oy + 11, INK, 4, 5); P(g, ox + 7, oy + 11, th.trunk, 2, 5);
  for (let ly = 0; ly < 14; ly++) for (let lx = 0; lx < 16; lx++){
    const dx = lx - 7.5, dy = ly - 6.5, d = dx * dx + dy * dy;
    if (d <= 7.6 * 7.6){
      let c = INK;
      if (d <= 6.6 * 6.6){ c = (dx + dy > 3) ? th.cnd : th.cn; if ((lx - 5) ** 2 + (ly - 4) ** 2 < 3) c = th.cnl; }
      P(g, ox + lx, oy + ly, c);
    }
  }
  P(g, ox + 10, oy + 6, th.cnl); P(g, ox + 4, oy + 9, th.cnd);
}
function pine(g, ox, oy, x, y, th){
  ground(g, ox, oy, x, y, th);
  P(g, ox + 6, oy + 12, INK, 4, 4); P(g, ox + 7, oy + 12, th.trunk, 2, 4);
  for (let ly = 0; ly < 13; ly++){
    const tier = Math.floor(ly / 4.4), w = Math.min(7, 1 + (ly % 4.4) * 1.1 + tier * 1.6) | 0;
    P(g, ox + 8 - w - 1, oy + ly, INK, (w + 1) * 2, 1);
    if (ly > 0) P(g, ox + 8 - w, oy + ly, th.cn, w * 2, 1);
    if (ly > 0) P(g, ox + 8, oy + ly, th.cnd, w, 1);
    if (ly > 1 && ly % 4 === 2) P(g, ox + 8 - w + 1, oy + ly, th.cnl, 2, 1);
  }
}
function palm(g, ox, oy, x, y, th){
  ground(g, ox, oy, x, y, th);
  for (let ly = 5; ly < 16; ly++){
    const tx = ox + 7 + (ly < 9 ? 1 : 0);
    P(g, tx - 1, oy + ly, INK, 4, 1); P(g, tx, oy + ly, ly % 3 ? th.trunk : '#7a4618', 2, 1);
  }
  const fr = [[-1,-1],[1,-1],[-1,0],[1,0],[0,-1]];
  fr.forEach(([dx, dy]) => {
    for (let i = 0; i < 7; i++){
      const px = ox + 8 + dx * i, py = oy + 4 + dy * i + (dx ? Math.floor(i * i / 10) : 0);
      if (px < ox || px > ox + 15 || py < oy) continue;
      P(g, px, py - 1, INK, 1, 3); P(g, px, py, i % 2 ? th.cn : th.cnl);
    }
  });
  P(g, ox + 7, oy + 4, '#7a4618', 2, 2);
}
function fence(g, ox, oy, x, y, th){
  ground(g, ox, oy, x, y, th);
  [5, 10].forEach(ry => { P(g, ox, oy + ry, INK, 16, 4); P(g, ox, oy + ry + 1, th.wood, 16, 2); });
  [2, 10].forEach(px => { P(g, ox + px, oy + 2, INK, 4, 13); P(g, ox + px + 1, oy + 3, th.wood, 2, 11); P(g, ox + px + 1, oy + 3, '#e8a868', 1, 1); });
}
function house(g, ox, oy, x, y, th){
  ground(g, ox, oy, x, y, th);
  P(g, ox + 2, oy + 7, INK, 12, 9); P(g, ox + 3, oy + 8, '#f8e8c0', 10, 8);
  for (let ly = 0; ly < 8; ly++){
    const h = ly + 1; P(g, ox + 8 - h, oy + ly, INK, h * 2, 1);
    if (ly > 0) P(g, ox + 8 - h + 1, oy + ly, ly % 2 ? '#d83c28' : '#b02c1c', h * 2 - 2, 1);
  }
  P(g, ox + 7, oy + 11, INK, 3, 5); P(g, ox + 8, oy + 12, '#7a3c10', 1, 4);
  P(g, ox + 4, oy + 9, INK, 3, 3); P(g, ox + 4, oy + 9, '#5cc8fc', 2, 2);
}
function rock(g, ox, oy, x, y, th){
  ground(g, ox, oy, x, y, th);
  for (let ly = 0; ly < 16; ly++) for (let lx = 0; lx < 16; lx++){
    const dx = (lx - 7.5) / 6.5, dy = (ly - 10) / 5, d = dx * dx + dy * dy;
    if (d <= 1.25) P(g, ox + lx, oy + ly, d > .95 ? INK : (dx + dy > .4 ? '#7c7c90' : '#a8a8bc'));
  }
  P(g, ox + 5, oy + 7, '#dcdce8', 2, 1); P(g, ox + 4, oy + 8, '#dcdce8', 1, 1);
}
function water(g, ox, oy, th){ P(g, ox, oy, th.w, 16, 16); }
function shore(g, ox, oy, x, y, th){
  P(g, ox, oy, th.shore, 16, 16);
  for (let i = 0; i < 5; i++) P(g, ox + ri(x,y,i+40,16), oy + ri(x,y,i+45,16), th.gd);
}
function bridge(g, ox, oy, x, y, th){
  water(g, ox, oy, th);
  P(g, ox + 2, oy, INK, 12, 16); P(g, ox + 3, oy, th.wood, 10, 16);
  for (let i = 0; i < 4; i++) P(g, ox + 3, oy + i * 4 + 3, th.woodD, 10, 1);
}

function renderBg(level){
  const bg = document.createElement('canvas'); bg.width = 256; bg.height = 192;
  const g = bg.getContext('2d'); const th = THEMES[level.theme];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
    const ch = grid[y][x], ox = x * T, oy = y * T;
    switch (ch){
      case '#': case 'T': (th.tree === 'pine' ? pine : th.tree === 'palm' ? palm : roundTree)(g, ox, oy, x, y, th); break;
      case '~': water(g, ox, oy, th); break;
      case '=': path(g, ox, oy, x, y, th); break;
      case '*': flower(g, ox, oy, x, y, th); break;
      case 'F': fence(g, ox, oy, x, y, th); break;
      case 'H': house(g, ox, oy, x, y, th); break;
      case 'R': rock(g, ox, oy, x, y, th); break;
      case ',': shore(g, ox, oy, x, y, th); break;
      case 'B': bridge(g, ox, oy, x, y, th); break;
      default: ground(g, ox, oy, x, y, th);
    }
  }
  return bg;
}

// 國字＋直式注音：國字在左，注音由上往下排在右邊，聲調在注音右邊，輕聲點在最上面。
// han 傳 false 代表只顯示注音（故意寫錯音的辨音選項）；沒傳就從對照表找。
const BPM = /[ㄅ-ㄯ]/, TONE = /[ˊˇˋ]/, CJK = /[㐀-鿿]/;
const Z = (s, han) => {
  s = String(s);
  if (han !== false && typeof han !== 'string') han = HZ.get(s.trim());
  const chars = typeof han === 'string' ? [...han].filter(c => CJK.test(c)) : [];
  const toks = [];
  let dot = false, letters = '';
  const flush = tone => { if (letters || dot) toks.push({ dot, letters, tone }); letters = ''; dot = false; };
  for (const ch of s){
    if (/\s/.test(ch)){ flush(); continue; }
    if (ch === '˙'){ flush(); dot = true; continue; }
    if (BPM.test(ch)){ letters += ch; continue; }
    if (TONE.test(ch) && letters){ flush(ch); continue; }
    flush(); toks.push({ pu:ch });
  }
  flush();
  const nSy = toks.filter(t => !t.pu).length;
  const pair = chars.length === nSy && nSy > 0;
  if (han !== false && !pair && nSy) console.warn('注音沒有對應的國字：', s, han);
  let k = 0;
  return toks.map(t => {
    if (t.pu) return `<span class="pu">${esc(t.pu)}</span>`;
    const sy = `<span class="sy${[...t.letters].length > 1 ? " m" : ""}"><span class="col">${t.dot ? '<i class="dot">˙</i>' : ''}${[...t.letters].map((c, i, a) => `<b>${c}${t.tone && i === a.length - 1 ? `<i class="tn">${t.tone}</i>` : ''}</b>`).join('')}</span></span>`;
    return pair ? `<span class="ru"><span class="hz">${esc(chars[k++])}</span>${sy}</span>` : sy;
  }).join('');
};

function zoneAt(tx, ty){ return ZONES.findIndex(z => tx >= z.x0 && tx <= z.x1 && ty >= z.y0 && ty <= z.y1); }
function renderTownBg(){
  const c = document.createElement('canvas'); c.width = 256; c.height = 192;
  const g = c.getContext('2d');
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
    const ch = TOWN_MAP[y][x], ox = x * T, oy = y * T;
    const z = zoneAt(x, y), th = THEMES[['farm','beach','forest','town','town'][z]] || THEMES.farm;
    if (ch === '='){ // 柏油路，路中間畫黃色虛線，路口不畫
      P(g, ox, oy, '#6c6c7c', 16, 16);
      for (let i = 0; i < 4; i++) P(g, ox + ri(x,y,i+5,16), oy + ri(x,y,i+9,16), '#7a7a8c');
      const horiz = y === 5, vert = x === 5 || x === 10;
      if (horiz && !vert) P(g, ox + 4, oy + 7, '#fcd000', 8, 2);
      if (vert && !horiz) P(g, ox + 7, oy + 4, '#fcd000', 2, 8);
      continue;
    }
    if (ch === 'p' || ch === 'S' || ch === 'q'){
      P(g, ox, oy, '#d6d2c8', 16, 16); P(g, ox, oy, '#bdb8ac', 16, 1); P(g, ox, oy, '#bdb8ac', 1, 16);
      continue;
    }
    if (ch === 'c'){ // 菜園
      P(g, ox, oy, '#8c5a2c', 16, 16);
      for (let r = 0; r < 4; r++){ P(g, ox, oy + r * 4 + 3, '#6c4420', 16, 1); for (let k = 0; k < 4; k++) P(g, ox + k * 4 + 1 + (r % 2), oy + r * 4, '#5cc83c', 2, 2); }
      continue;
    }
    switch (ch){
      case '#': case 'T': (th.tree === 'pine' ? pine : th.tree === 'palm' ? palm : roundTree)(g, ox, oy, x, y, th); break;
      case '~': water(g, ox, oy, th); break;
      case '*': flower(g, ox, oy, x, y, th); break;
      case 'H': house(g, ox, oy, x, y, th); break;
      case ',': shore(g, ox, oy, x, y, th); break;
      default: ground(g, ox, oy, x, y, th);
    }
  }
  // 便利商店建築（4×2 格）
  const sx = 11 * T, sy = 7 * T;
  P(g, sx, sy, INK, 64, 32); P(g, sx + 1, sy + 1, '#f6eedc', 62, 30);
  P(g, sx + 1, sy + 1, '#ff8c1a', 62, 3); P(g, sx + 1, sy + 4, '#2c9c4c', 62, 3); P(g, sx + 1, sy + 7, '#e83c3c', 62, 2);
  P(g, sx + 4, sy + 12, INK, 22, 16); P(g, sx + 5, sy + 13, '#9cd8f4', 20, 14);
  P(g, sx + 38, sy + 12, INK, 22, 16); P(g, sx + 39, sy + 13, '#9cd8f4', 20, 14);
  for (let k = 0; k < 5; k++){ P(g, sx + 7 + k, sy + 15 + k, '#e6f6ff'); P(g, sx + 41 + k, sy + 15 + k, '#e6f6ff'); }
  P(g, sx + 27, sy + 13, INK, 10, 19); P(g, sx + 28, sy + 14, '#bfe3f5', 8, 18); P(g, sx + 31, sy + 14, INK, 1, 18);
  // 魚店建築（4×2 格）：藍白遮雨棚、大魚招牌、魚缸櫥窗
  ensureSea();
  const fx = 6 * T, fy = 1 * T;
  P(g, fx, fy - 6, INK, 64, 38); P(g, fx + 1, fy - 5, '#e6f4fa', 62, 36);
  P(g, fx + 14, fy - 10, INK, 36, 10); P(g, fx + 15, fy - 9, '#2c78e0', 34, 8);
  g.drawImage(SEASPR.fish[1], fx + 23, fy - 11);
  P(g, fx, fy + 2, INK, 64, 9);
  for (let k = 0; k < 8; k++){ P(g, fx + 1 + k * 8, fy + 3, k % 2 ? '#ffffff' : '#2c78e0', 8, 7); P(g, fx + 3 + k * 8, fy + 10, k % 2 ? '#ffffff' : '#2c78e0', 4, 2); }
  P(g, fx + 4, fy + 14, INK, 24, 16); P(g, fx + 5, fy + 15, '#5cb4fc', 22, 14);
  g.drawImage(SEASPR.fish[0], fx + 6, fy + 16); g.drawImage(SEASPR.shrimp, fx + 11, fy + 19);
  P(g, fx + 5, fy + 26, '#f0d890', 22, 3);
  P(g, fx + 36, fy + 14, INK, 24, 16); P(g, fx + 37, fy + 15, '#5cb4fc', 22, 14);
  g.drawImage(SEASPR.octopus, fx + 39, fy + 16); P(g, fx + 37, fy + 26, '#f0d890', 22, 3);
  P(g, fx + 29, fy + 15, INK, 6, 17); P(g, fx + 30, fy + 16, '#8c5a2c', 4, 16);
  // 小公園的噴水池（2×2 格）
  const ox2 = 7 * T, oy2 = 7 * T;
  for (let yy = 0; yy < 32; yy++) for (let xx = 0; xx < 32; xx++){
    const d = (xx - 15.5) ** 2 + (yy - 15.5) ** 2;
    if (d <= 15 * 15) P(g, ox2 + xx, oy2 + yy, d > 13 * 13 ? INK : d > 11 * 11 ? '#bdb8ac' : '#5cb4fc');

  const n = npcAt(nx, ny);
  if (n){ openTalk(n); return; }
  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || SOLID.has(grid[ny][nx])){
    if (bumpCool <= 0){ SFX.bump(); bumpCool = 18; }
    return;
  }
  if (follower){ follower.tx = player.x; follower.ty = player.y; }
  Object.assign(player, { x:nx, y:ny, dx, dy, moving:true });
}
function update(){
  if (bumpCool > 0) bumpCool--;
  if (helpOpen) return;
  if (state.mode !== 'play') return;
  if (L.type === 'shop' || L.type === 'fish'){ updateShop(); if (L.type === 'fish') updateSea(); return; }
  const p = player;
  if (p.moving){
    p.px += p.dx * SPEED; p.py += p.dy * SPEED; p.step++;
    if (p.px === p.x * T && p.py === p.y * T){
      p.moving = false;
      // 只在走到目的地（點的那一格）才檢查食物，路上經過的不算
      if (L.type === 'feed' && (!walkPath || !walkPath.dirs.length)) feedArrive();
    }
  }
  if (follower){
    const tx = follower.tx * T, ty = follower.ty * T;
    follower.px += Math.sign(tx - follower.px) * Math.min(SPEED, Math.abs(tx - follower.px));
    follower.py += Math.sign(ty - follower.py) * Math.min(SPEED, Math.abs(ty - follower.py));
  }
  if (state.mode !== 'play') return;
  if (held.length) walkPath = null;
  if (!p.moving && held.length) tryMove(held[held.length - 1]);
  else if (!p.moving && walkPath){
    if (walkPath.dirs.length) tryMove(walkPath.dirs.shift());
    else { const t = walkPath.talk; walkPath = null; if (t) tryMove(t); }
  }
}

/* ---------- 森林：帶動物去找喜歡吃的東西 ---------- */

// 動物請你幫忙的五種說法，每次進森林隨機分給五隻動物（一隻一種）
const FEED_TPL = [
  [z => `ㄨㄛˇ ㄉㄨˋ ˙ㄗ ㄜˋ ˙ㄌㄜ，ㄑㄧㄥˇ ㄉㄞˋ ㄨㄛˇ ㄑㄩˋ ㄓㄠˇ ${z}！`, h => `我肚子餓了，請帶我去找${h}！`],

  [z => `${z} ㄎㄢˋ ㄑㄧˇ ㄌㄞˊ ㄏㄠˇ ㄏㄠˇ ㄔ！ㄑㄧㄥˇ ㄉㄞˋ ㄨㄛˇ ㄑㄩˋ ㄓㄠˇ。`, h => `${h}看起來好好吃！請帶我去找。`],

  [z => `ㄍㄨ ㄌㄨ ㄍㄨ ㄌㄨ～ㄨㄛˇ ㄒㄧㄤˇ ㄔ ${z}！`, h => `咕嚕咕嚕～我想吃${h}！`]];
function feedTalk(npc){

  if (npc.done){ feedDialog(npc, [['ㄏㄠˇ ㄏㄠˇ ㄔ！ㄒㄧㄝˋ ˙ㄒㄧㄝ ㄋㄧˇ！', '好好吃！謝謝你！']]).onclick = closeTalk; return; }

// 每次進森林：每隻動物從愛吃的清單挑一種（不重複），再加 3 種干擾食物；
// 動物和食物隨機放在空地上，確認全部走得到、動物不擋路，而且動物離自己要的食物遠一點
function setupFeed(){
  const free = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++)
    if (grid[y][x] === '.' && Math.abs(x - player.x) + Math.abs(y - player.y) > 2) free.push([x, y]);
  const reachable = (animals) => {
    const block = new Set(animals.map(p => p.join()));
    const seen = new Set([player.x + ',' + player.y]), q = [[player.x, player.y]];
    while (q.length){
      const [x, y] = q.shift();
      for (const [dx, dy] of Object.values(DIRS)){
        const nx = x + dx, ny = y + dy, k = nx + ',' + ny;
        if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || seen.has(k) || block.has(k) || SOLID.has(grid[ny][nx])) continue;
        seen.add(k); q.push([nx, ny]);
      }
    }
    return seen;
  };
  for (let tries = 0; tries < 400; tries++){
    const used = new Set(), wants = [];
    for (const n of L.npcs){
      const opts = shuffle(n.likes.filter(k => !used.has(k)));
      if (!opts.length) break;
      wants.push(opts[0]); used.add(opts[0]);
    }
    if (wants.length < L.npcs.length) continue;
    const extra = shuffle(Object.keys(L.foods).filter(k => !used.has(k))).slice(0, 3);
    const spots = shuffle(free.slice()), aSpots = spots.slice(0, L.npcs.length);
    // 動物彼此至少隔 3 格，頭上的「!」才不會疊在一起
    if (aSpots.some((p, i) => aSpots.some((q, j) => j > i && Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]) < 3))) continue;
    const keys = shuffle([...wants, ...extra]), fSpots = spots.slice(L.npcs.length, L.npcs.length + keys.length);
    const seen = reachable(aSpots);
    if (!fSpots.every(p => seen.has(p.join()))) continue;
    if (!aSpots.every(([x, y]) => Object.values(DIRS).some(([dx, dy]) => seen.has((x + dx) + ',' + (y + dy))))) continue;
    const far = wants.every((w, i) => { const fp = fSpots[keys.indexOf(w)], ap = aSpots[i]; return Math.abs(fp[0] - ap[0]) + Math.abs(fp[1] - ap[1]) >= 6; });
    if (!far && tries < 300) continue;
    const tpls = shuffle(FEED_TPL.map((_, i) => i));
    npcs = L.npcs.map((n, i) => ({ ...n, idx:i, x:aSpots[i][0], y:aSpots[i][1], done: state.got.has(i), wants: wants[i], tpl: tpls[i % tpls.length] }));
    foods = keys.map((k, i) => ({ id:k, x:fSpots[i][0], y:fSpots[i][1], ...L.foods[k], eaten:false }));
    return;
  }
}

// 主角每走完一格就檢查：腳下有食物、又有動物跟著，就看對不對
function feedArrive(){
  const fd = foodAt(player.x, player.y);
  if (!fd || !follower) return;
  const npc = follower, want = L.foods[npc.wants];
  walkPath = null; held = [];
  if (fd.id === npc.wants){
    fd.eaten = true; npc.done = true; npc.following = false; follower = null;
    npc.x = npc.tx; npc.y = npc.ty;
    state.got.add(npc.idx); renderHud(npc.idx); SFX.ok(); setTimeout(SFX.item, 300);
    feedDialog(npc, [['ㄏㄠˇ ㄏㄠˇ ㄔ！ㄒㄧㄝˋ ˙ㄒㄧㄝ ㄋㄧˇ！', '好好吃！謝謝你！']], fd.e).onclick = () => {
      closeTalk();
      if (npcs.every(n => n.done)){ state.mode = 'busy'; setTimeout(levelClear, 400); }
    };
  } else {
    state.mistakes++; SFX.no();
    feedDialog(npc, [[`ㄅㄨˋ ㄕˋ ㄓㄜˋ ˙ㄍㄜ ˙ㄛ，ㄨㄛˇ ㄒㄧㄤˇ ㄔ ${want.z}。`, `不是這個喔，我想吃${want.h}。`]]).onclick = closeTalk;
  }
}

function drawSprite(c, x, y, flip){
  if (flip){ ctx.save(); ctx.translate(x + 18, y); ctx.scale(-1, 1); ctx.drawImage(c, 0, 0); ctx.restore(); }
  else ctx.drawImage(c, x, y);
}
function draw(){
  frame++;
  if (state.mode === 'title'){ drawTown(); return; }
  if (L.type === 'fish'){ drawSea(); return; }
  if (L.type === 'shop'){ drawShop(); return; }
  ctx.drawImage(bg, 0, 0);
  const th = THEMES[L.theme], s = Math.floor(frame / 30) % 2;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
    if (grid[y][x] !== '~') continue;
    const ox = x * T, oy = y * T;
    P(ctx, ox + 2 + s * 4, oy + 4, th.wl, 4, 1); P(ctx, ox + 3 + s * 4, oy + 3, th.wl, 2, 1);
    P(ctx, ox + 10 - s * 4, oy + 11, th.wl, 4, 1); P(ctx, ox + 11 - s * 4, oy + 10, th.wl, 2, 1);
  }
  if (L.theme === 'beach'){ // 浪花
    for (let x = 0; x < COLS; x++) for (let y = 1; y < ROWS; y++){
      if (grid[y][x] === ',' && grid[y - 1][x] === '~') P(ctx, x * T + ((x + s) % 2) * 4, y * T, '#ffffff', 8, 1);
    }
  }
  foods.forEach(fd => { if (!fd.eaten) drawSprite(foodSpr(fd.e), fd.x * T - 1, fd.y * T - 1 - (Math.floor((frame + fd.x * 9) / 40) % 2), false); });
  const ents = npcs.map(n => ({ y: n.following ? n.py : n.y * T, f:() => {
    const bob = (Math.floor((frame + n.idx * 17) / 32) % 2);
    const nx = n.following ? n.px : n.x * T, ny = n.following ? n.py : n.y * T;
    drawSprite(SPR[n.sprite].front[n.following && (Math.floor(frame / 8) % 2) ? 1 : 0], nx - 1, ny - 2 - bob, false);
    if (n.following) return;
    const bx = nx + 4, by = ny - 11 - bob;
    if (!n.done){
      const j = Math.floor(frame / 20) % 2;
      P(ctx, bx, by - j, INK, 9, 10); P(ctx, bx + 1, by + 1 - j, '#ffffff', 7, 8);
      P(ctx, bx + 4, by + 2 - j, '#e03030', 1, 4); P(ctx, bx + 4, by + 7 - j, '#e03030', 1, 1);
    } else {
      const hx = bx + 1, hy = by + 3;
      P(ctx, hx + 1, hy, '#ff5a8c', 2, 1); P(ctx, hx + 4, hy, '#ff5a8c', 2, 1);
      P(ctx, hx, hy + 1, '#ff5a8c', 7, 2); P(ctx, hx + 1, hy + 3, '#ff5a8c', 5, 1); P(ctx, hx + 2, hy + 4, '#ff5a8c', 3, 1); P(ctx, hx + 3, hy + 5, '#ff5a8c', 1, 1);
    }
  }}));
  ents.push({ y:player.py, f:() => {
    const fr = player.moving ? Math.floor(player.step / 4) % 2 : 0;
    const set = player.face === 'u' ? SPR.player.back : SPR.player.front;
    drawSprite(set[fr], player.px - 1, player.py - 2, player.face === 'l');
  }});
  if (walkPath && !npcAt(walkPath.tx, walkPath.ty)){
    const x = walkPath.tx * T, y = walkPath.ty * T, c = Math.floor(frame / 8) % 2 ? '#fcbc3c' : '#ffffff';
    [[0, 0], [12, 0], [0, 12], [12, 12]].forEach(([ox, oy]) => {
      P(ctx, x + ox, y + oy + (oy ? 3 : 0), c, 4, 1);
      P(ctx, x + ox + (ox ? 3 : 0), y + oy, c, 1, 4);
    });
  }
  ents.sort((a, b) => a.y - b.y).forEach(e => e.f());
}
function loop(){ update(); draw(); requestAnimationFrame(loop); }

const KEYMAP = { ArrowUp:'u', ArrowDown:'d', ArrowLeft:'l', ArrowRight:'r', w:'u', s:'d', a:'l', d:'r', W:'u', S:'d', A:'l', D:'r' };
addEventListener('keydown', e => {
  if (helpOpen){ if (e.key === 'Escape') closeHelp(); return; }
  const dir = KEYMAP[e.key];
  if (state.mode === 'title'){
    if (dir){
      e.preventDefault();
      const [dx, dy] = DIRS[dir];
      if (townSel < 0) selectZone(0);
      else selectZone((townSel + (dx + dy > 0 ? 1 : -1) + ZONES.length) % ZONES.length);
    } else if ((e.key === 'Enter' || e.key === ' ') && townSel >= 0 && !(document.activeElement && document.activeElement.dataset.zone)){ e.preventDefault(); enterZone(townSel); }
    return;
  }
  if (state.mode === 'play' && L.type === 'shop'){
    if (dir){ e.preventDefault(); moveCursor(dir); }
    else if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); if (shop.showCursor) pickItem(shop.cursor); else { shop.showCursor = true; } }
    return;
  }
  if (state.mode === 'play'){
    if (dir){ e.preventDefault(); if (!held.includes(dir)) held.push(dir); }

  }
  if (ov.hidden) return;
  if (/^[1-4]$/.test(e.key)){
    const b = ov.querySelectorAll('.opt')[+e.key - 1];
    if (b && !b.disabled){ e.preventDefault(); b.click(); }
    return;
  }
  if (e.key === 'Escape' && state.mode === 'talk' && ov.querySelector('[data-close]')){ closeTalk(); return; }
  if (e.key === 'Escape' && state.mode === 'intro'){ showTitle(); return; }
  if (e.key.startsWith('Arrow')){
    const list = [...ov.querySelectorAll('button:not(:disabled)')].filter(b => !b.hasAttribute('data-close'));
    if (!list.length) return;
    e.preventDefault();

    const a = document.activeElement;

// 點地圖走路：點空地就走過去，點角色就走到旁邊並開始對話（鍵盤方向鍵照樣可以用）
function setPad(){}
let walkPath = null;
function findPath(sx, sy, goals){
  const key = (x, y) => x + ',' + y, prev = new Map([[key(sx, sy), null]]), q = [[sx, sy]];
  while (q.length){
    const [x, y] = q.shift();
    if (goals.has(key(x, y))){
      const dirs = []; let k = key(x, y);
      while (prev.get(k)){ const [d, pk] = prev.get(k); dirs.unshift(d); k = pk; }
      return dirs;
    }
    for (const [d, [dx, dy]] of Object.entries(DIRS)){
      const nx = x + dx, ny = y + dy, nk = key(nx, ny);
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || prev.has(nk) || SOLID.has(grid[ny][nx]) || npcAt(nx, ny)) continue;
      prev.set(nk, [d, key(x, y)]); q.push([nx, ny]);
    }
  }
  return null;
}
function tapWalk(t){
  if (L.type === 'feed' && follower && follower.tx === t.x && follower.ty === t.y){ state.mode = 'talk'; feedTalk(follower); return; }
  if (t.x < 0 || t.y < 0 || t.x >= COLS || t.y >= ROWS) return;
  const n = npcAt(t.x, t.y), goals = new Set();
  if (n) Object.values(DIRS).forEach(([dx, dy]) => goals.add((n.x + dx) + ',' + (n.y + dy)));
  else goals.add(t.x + ',' + t.y);
  const dirs = findPath(player.x, player.y, goals);
  if (!dirs){ SFX.bump(); return; }
  let talk = null;
  if (n){
    let x = player.x, y = player.y;
    dirs.forEach(d => { x += DIRS[d][0]; y += DIRS[d][1]; });
    talk = Object.keys(DIRS).find(d => x + DIRS[d][0] === n.x && y + DIRS[d][1] === n.y);
  }
  held = [];
  walkPath = { dirs, talk, tx:t.x, ty:t.y };
  SFX.blip();
}

  let used = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + parseFloat(root.paddingTop) + parseFloat(root.paddingBottom);

    if (el === stage || el.id === 'helpModal' || getComputedStyle(el).display === 'none') return;
    used += el.offsetHeight + gap;
  });
  const innerW = wrap.clientWidth - 32 - 8;
  const h = Math.max(270, Math.min(Math.floor(innerW * 3 / 4), innerHeight - used - 14 - 8));
  stage.classList.add('wide');
  stage.style.height = (h + 8) + 'px';
  cv.style.width = town.style.width = Math.floor(h * 4 / 3) + 'px';
}

// navigator.audioSession 是 iOS 17 以上的 Safari 才有，設成 playback 時開著靜音也能出聲。
let audioUnlocked = false;
function unlockAudio(){
  if (audioUnlocked && AC && AC.state === 'running') return;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  const a = audio(); if (!a) return;
  try {
    const src = a.createBufferSource();
    src.buffer = a.createBuffer(1, 1, 22050);
    src.connect(a.destination); src.start(0);
  } catch (e) {}
  const p = a.resume && a.resume();
  if (p && p.then) p.then(() => { audioUnlocked = a.state === 'running'; }).catch(() => {});
  else audioUnlocked = a.state === 'running';
}
['touchstart', 'touchend', 'pointerdown', 'click', 'keydown'].forEach(ev => addEventListener(ev, unlockAudio, { passive:true, capture:true }));

}
